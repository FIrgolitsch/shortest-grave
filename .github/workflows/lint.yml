name: Lint

# Runs checkstyleMain and checkstyleTest and uploads the reports.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: Gradle Checkstyle (Java 11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run checkstyle
        run: ./gradlew checkstyleMain checkstyleTest
        shell: bash

      - name: Checkstyle summary
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, os, glob
          total = 0
          lines = []
          for path in sorted(glob.glob("build/reports/checkstyle/*.xml")):
              tree = ET.parse(path)
              for f in tree.getroot().findall("file"):
                  errors = f.findall("error")
                  if errors:
                      name = f.get("name", "").replace(os.getcwd() + "/", "")
                      lines.append(f"\n**`{name}`**")
                      for e in errors:
                          lines.append(f"- Line {e.get('line')}: {e.get('message')} *({e.get('source','').split('.')[-1]})*")
                      total += len(errors)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              if total == 0:
                  out.write("## ✅ Checkstyle\n\nNo violations found.\n")
              else:
                  out.write(f"## ❌ Checkstyle — {total} violation(s)\n")
                  out.write("\n".join(lines) + "\n")
          EOF
        shell: bash

      - name: Upload Checkstyle HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-html
          path: build/reports/checkstyle
          if-no-files-found: warn

      - name: Upload Checkstyle XML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-xml
          path: build/reports/checkstyle/*.xml
          if-no-files-found: warn

